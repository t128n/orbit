name: Windows binary

on:
  push:
    branches: [main]
  # A published GitHub release also gets the Windows binary attached.
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # `[workspace.package] version` in Cargo.toml is the Orbit version. A release tag must be `v<version>`.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Orbit-CX features live in orbit-cx/patches/, so read the version from the same
      # patched tree that the Windows job builds. See orbit-cx/docs/patches.md.
      - name: Verify the Orbit-CX patch series
        run: bash orbit-cx/scripts/apply-patches.sh --check
      - name: Apply the Orbit-CX patch series
        run: bash orbit-cx/scripts/apply-patches.sh
      - name: Read version from Cargo.toml
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(bash scripts/version.sh)
          echo "Orbit version: $version"
          if [ "$EVENT" = release ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag '$TAG' does not match Cargo.toml version '$version'. Use tag 'v$version', or change the version with 'just version <new>' first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Bare-metal Windows deployment: no Docker, no musl. The web frontend and the Rust workspace
  # both build natively on windows-latest.
  windows-binary:
    needs: version
    runs-on: windows-latest
    env:
      ORBIT_BUILD_REVISION: ${{ github.sha }}
    steps:
      # The patch files use LF endings; keep Git for Windows from rewriting the checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # Apply the patch series before building, so the released binary contains the Orbit-CX
      # features. See orbit-cx/docs/patches.md.
      - name: Verify the Orbit-CX patch series
        shell: pwsh
        run: ./orbit-cx/scripts/apply-patches.ps1 -Check
      - name: Apply the Orbit-CX patch series
        shell: pwsh
        run: ./orbit-cx/scripts/apply-patches.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --filter web
      - name: Build the web frontend
        working-directory: apps/web
        run: bun run build
      - name: Run the platform and server unit tests
        run: cargo test --locked -p orbit-platform -p orbit-server --lib
      - name: Build the release binary
        run: cargo build --locked --release -p orbit-server
      - run: ./target/release/orbit.exe --help
      - name: Package the release binary
        if: github.event_name == 'release'
        run: Compress-Archive -Path target/release/orbit.exe -DestinationPath orbit-windows-x86_64.zip
      - name: Keep release binary for the release job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: orbit-windows-x86_64
          path: orbit-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'release'
    needs: [version, windows-binary]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: orbit-windows-x86_64
      - name: Attach the binary and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum orbit-windows-x86_64.zip | tee SHA256SUMS
          # --clobber replaces the files when the workflow runs again for the same release.
          gh release upload "$TAG" orbit-windows-x86_64.zip SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
