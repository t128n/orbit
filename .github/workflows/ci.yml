name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: extractions/setup-just@v3
      # Orbit-CX features live in orbit-cx/patches/, so every build and check runs on the
      # patched tree. See orbit-cx/docs/patches.md.
      - name: Verify the Orbit-CX patch series
        run: bash orbit-cx/scripts/apply-patches.sh --check
      - name: Apply the Orbit-CX patch series
        run: bash orbit-cx/scripts/apply-patches.sh
      # The patch series was generated from feature branches that predate formatting. Normalize
      # it so `just check` (cargo fmt --check) passes on the tree we actually ship.
      - run: cargo fmt --all
      - run: just setup
      # The patch series does not carry the generated OpenAPI client, so regenerate it before
      # the checks to keep `just api-check` consistent with the patched server.
      - name: Regenerate the API contract for the patched tree
        run: just api
      - run: bun x playwright install --with-deps chromium
        working-directory: apps/web
      - run: just check
      - run: just e2e
      - uses: docker/setup-buildx-action@v3
      # Reads the layer cache that the amd64 job of image.yml writes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ORBIT_BUILD_REVISION=${{ github.sha }}
          tags: orbit:ci
          load: true
          cache-from: type=gha,scope=orbit-amd64
      - run: docker run --rm orbit:ci --help
      - run: bash deploy/smoke.sh orbit:ci
